<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GentleGiant Music</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            background: #111117;
            border-bottom: 1px solid #272731;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #1db954;
        }

        .search {
            width: 420px;
            background: #22222b;
            border: none;
            outline: none;
            border-radius: 30px;
            padding: 13px 20px;
            color: white;
            font-size: 15px;
        }

        main {
            padding: 35px;
            padding-bottom: 160px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 30px;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 22px;
        }

        .song {
            background: #15151c;
            border-radius: 12px;
            overflow: hidden;
            transition: .2s;
            cursor: pointer;
        }

        .song:hover {
            transform: translateY(-4px);
            background: #1d1d26;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .song-info {
            padding: 15px;
        }

        .song-title {
            font-weight: bold;
            margin-bottom: 7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            color: #999;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .buttons {
            display: flex;
            gap: 7px;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .play-btn {
            background: #1db954;
            color: black;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .lyrics-btn,
        .video-btn {
            background: #292932;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
        }

        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 125px;
            background: #121217;
            border-top: 1px solid #292932;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 25px;
            z-index: 20;
        }

        .now-playing {
            width: 250px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .now-playing img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
        }

        .now-title {
            font-weight: bold;
        }

        .now-artist {
            color: #999;
            font-size: 13px;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .control {
            background: transparent;
            color: white;
            font-size: 24px;
        }

        .main-play {
            background: white;
            color: black;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
        }

        .progress-container {
            flex: 1;
        }

        .progress {
            width: 100%;
            accent-color: #1db954;
            cursor: pointer;
        }

        .time {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 12px;
        }

        #youtube-player {
            display: none;
        }

        .empty {
            color: #777;
            text-align: center;
            margin-top: 60px;
            grid-column: 1 / -1;
        }

        @media(max-width: 800px) {
            .search {
                width: 250px;
            }

            .now-playing {
                width: 180px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        GG<span>Music</span>
    </div>

    <input
        id="search"
        class="search"
        placeholder="Search songs, artists..."
        autocomplete="off"
    >
</header>

<main>
    <h1>Discover Music</h1>
    <p class="subtitle">
        Search real music videos and play them directly in the app.
    </p>

    <div id="results" class="results"></div>
</main>

<div id="youtube-player"></div>

<div class="player">

    <div class="now-playing">

        <img id="now-image"
             src="https://i.ytimg.com/vi/8ekJMC8OtGU/hqdefault.jpg">

        <div>
            <div id="now-title" class="now-title">
                Select a song
            </div>

            <div id="now-artist" class="now-artist">
                Nothing playing
            </div>
        </div>

    </div>

    <div class="controls">

        <button class="control" onclick="previousSong()">
            ⏮
        </button>

        <button id="playPause"
                class="main-play"
                onclick="togglePlay()">
            ▶
        </button>

        <button class="control" onclick="nextSong()">
            ⏭
        </button>

    </div>

    <div class="progress-container">

        <input
            id="progress"
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0"
        >

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

    </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

    /*
       ============================================
       PUT YOUR YOUTUBE DATA API KEY HERE
       ============================================
    */

    const API_KEY = "YOUR_YOUTUBE_API_KEY";


    let player;

    let songs = [];

    let currentIndex = -1;

    let isReady = false;


    /*
       ============================================
       YOUTUBE PLAYER
       ============================================
    */

    function onYouTubeIframeAPIReady() {

        player = new YT.Player("youtube-player", {

            height: "0",

            width: "0",

            videoId: "",

            playerVars: {

                autoplay: 0,

                controls: 0,

                rel: 0

            },

            events: {

                onReady: function () {

                    isReady = true;

                },

                onStateChange: function(event) {

                    if (
                        event.data ===
                        YT.PlayerState.PLAYING
                    ) {

                        document.getElementById(
                            "playPause"
                        ).innerText = "⏸";

                    }

                    if (
                        event.data ===
                        YT.PlayerState.PAUSED
                    ) {

                        document.getElementById(
                            "playPause"
                        ).innerText = "▶";

                    }

                    if (
                        event.data ===
                        YT.PlayerState.ENDED
                    ) {

                        nextSong();

                    }

                }

            }

        });

    }


    /*
       ============================================
       SEARCH YOUTUBE
       ============================================
    */

    const searchBox =
        document.getElementById("search");


    searchBox.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                searchYouTube(
                    searchBox.value.trim()
                );

            }

        }
    );


    async function searchYouTube(query) {

        if (!query) return;


        const results =
            document.getElementById("results");


        results.innerHTML = `
            <div class="empty">
                Searching YouTube...
            </div>
        `;


        /*
           Search for music videos.
        */

        const url =
            "https://www.googleapis.com/youtube/v3/search?" +

            new URLSearchParams({

                part: "snippet",

                q: query + " official audio",

                type: "video",

                videoCategoryId: "10",

                maxResults: 24,

                key: API_KEY

            });


        try {

            const response =
                await fetch(url);


            const data =
                await response.json();


            if (!data.items) {

                throw new Error(
                    data.error?.message ||
                    "Search failed"
                );

            }


            songs =
                data.items.map(item => ({

                    id:
                        item.id.videoId,

                    title:
                        item.snippet.title,

                    channel:
                        item.snippet.channelTitle,

                    image:
                        item.snippet.thumbnails
                            .high.url

                }));


            displaySongs();

        }

        catch(error) {

            console.error(error);


            results.innerHTML = `
                <div class="empty">

                    Search failed.

                    <br><br>

                    Make sure your YouTube API
                    key is correctly configured.

                    <br><br>

                    ${error.message}

                </div>
            `;

        }

    }


    /*
       ============================================
       DISPLAY RESULTS
       ============================================
    */

    function displaySongs() {

        const results =
            document.getElementById("results");


        results.innerHTML = "";


        if (!songs.length) {

            results.innerHTML = `
                <div class="empty">
                    No songs found.
                </div>
            `;

            return;

        }


        songs.forEach((song, index) => {

            const card =
                document.createElement("div");


            card.className = "song";


            card.innerHTML = `

                <img
                    class="thumbnail"
                    src="${song.image}"
                    alt=""
                >

                <div class="song-info">

                    <div class="song-title">
                        ${escapeHTML(song.title)}
                    </div>

                    <div class="artist">
                        ${escapeHTML(song.channel)}
                    </div>

                    <div class="buttons">

                        <button
                            class="play-btn"
                            onclick="playSong(${index})"
                        >
                            ▶ Play
                        </button>

                        <button
                            class="lyrics-btn"
                            onclick="openLyrics(${index})"
                        >
                            Lyrics
                        </button>

                        <button
                            class="video-btn"
                            onclick="openVideo(${index})"
                        >
                            Video
                        </button>

                    </div>

                </div>
            `;


            results.appendChild(card);

        });

    }


    /*
       ============================================
       PLAY SONG
       ============================================
    */

    function playSong(index) {

        if (!isReady) {

            alert(
                "Music player is still loading..."
            );

            return;

        }


        if (!songs[index]) return;


        currentIndex = index;


        const song = songs[index];


        player.loadVideoById(song.id);


        document.getElementById(
            "now-title"
        ).innerText = cleanTitle(song.title);


        document.getElementById(
            "now-artist"
        ).innerText = song.channel;


        document.getElementById(
            "now-image"
        ).src = song.image;


        document.getElementById(
            "playPause"
        ).innerText = "⏸";

    }


    /*
       ============================================
       PLAY / PAUSE
       ============================================
    */

    function togglePlay() {

        if (!player) return;


        const state =
            player.getPlayerState();


        if (
            state ===
            YT.PlayerState.PLAYING
        ) {

            player.pauseVideo();

        }

        else {

            player.playVideo();

        }

    }


    /*
       ============================================
       NEXT
       ============================================
    */

    function nextSong() {

        if (!songs.length) return;


        let next =
            currentIndex + 1;


        if (next >= songs.length) {

            next = 0;

        }


        playSong(next);

    }


    /*
       ============================================
       PREVIOUS
       ============================================
    */

    function previousSong() {

        if (!songs.length) return;


        let previous =
            currentIndex - 1;


        if (previous < 0) {

            previous =
                songs.length - 1;

        }


        playSong(previous);

    }


    /*
       ============================================
       PROGRESS BAR
       ============================================
    */

    setInterval(function() {

        if (
            !player ||
            !isReady ||
            currentIndex < 0
        ) return;


        const current =
            player.getCurrentTime();


        const duration =
            player.getDuration();


        if (!duration) return;


        const percentage =
            (current / duration) * 100;


        document.getElementById(
            "progress"
        ).value = percentage;


        document.getElementById(
            "currentTime"
        ).innerText =
            formatTime(current);


        document.getElementById(
            "duration"
        ).innerText =
            formatTime(duration);

    }, 500);


    document.getElementById(
        "progress"
    ).addEventListener(
        "input",
        function() {

            if (!player) return;


            const duration =
                player.getDuration();


            const time =
                (this.value / 100) *
                duration;


            player.seekTo(
                time,
                true
            );

        }
    );


    /*
       ============================================
       LYRICS
       ============================================
    */

    function openLyrics(index) {

        const song =
            songs[index];


        const query =
            encodeURIComponent(
                cleanTitle(song.title) +
                " " +
                song.channel +
                " lyrics"
            );


        window.open(
            "https://www.google.com/search?q=" +
            query,
            "_blank"
        );

    }


    /*
       ============================================
       VIDEO
       ============================================
    */

    function openVideo(index) {

        const song =
            songs[index];


        window.open(
            "https://www.youtube.com/watch?v=" +
            song.id,
            "_blank"
        );

    }


    /*
       ============================================
       HELPERS
       ============================================
    */

    function formatTime(seconds) {

        seconds =
            Math.floor(seconds || 0);


        const minutes =
            Math.floor(seconds / 60);


        const remaining =
            seconds % 60;


        return minutes +
            ":" +
            String(remaining)
                .padStart(2, "0");

    }


    function cleanTitle(title) {

        return title
            .replace(
                /\(.*?\)/g,
                ""
            )
            .replace(
                /\[.*?\]/g,
                ""
            )
            .trim();

    }


    function escapeHTML(value) {

        const div =
            document.createElement("div");


        div.textContent =
            value;


        return div.innerHTML;

    }


    /*
       ============================================
       INITIAL SEARCH
       ============================================
    */

    window.addEventListener(
        "load",
        function() {

            searchYouTube("Drake");

        }
    );

</script>

</body>
</html>
